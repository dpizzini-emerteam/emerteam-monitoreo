<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EMERTEAM · Monitoreo ambiental</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="color-scheme" content="light dark" />
  <script>
    // Aplica el tema elegido antes de pintar, para evitar un destello
    try { var t = localStorage.getItem("mon_tema"); if (t === "claro" || t === "oscuro") document.documentElement.dataset.tema = t; } catch (e) {}
  </script>
  <script>
    // Si la página quedó de una versión anterior y su código ya no existe, se recarga una vez para tomar la nueva
    window.addEventListener("error", function (e) {
      var el = e.target;
      if (!el || el.tagName !== "SCRIPT" || !/\/assets\//.test(el.src || "")) return;
      try {
        var ultima = +(sessionStorage.getItem("mon-recarga-version") || 0);
        if (Date.now() - ultima < 30000) return;
        sessionStorage.setItem("mon-recarga-version", String(Date.now()));
      } catch (x) {}
      location.reload();
    }, true);
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
