[build]
  base = "web"
  command = "npx vite build"
  publish = "dist"

# La página principal siempre se revalida (los archivos con hash sí se guardan en caché)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
[build.environment]
  NODE_VERSION = "22"

# La dirección de Netlify lleva a la dirección propia
[[redirects]]
  from = "https://emerteam-monitoreo.netlify.app/*"
  to = "https://riesgoambiental.emerteam.com.ar/:splat"
  status = 301
  force = true
