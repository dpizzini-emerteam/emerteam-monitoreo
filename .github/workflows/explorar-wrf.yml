name: Exploración WRF SMN

on:
  workflow_dispatch:
    inputs:
      corrida:
        description: "AAAAMMDDHH (vacío: la última completa)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy==2.1.3 requests==2.32.3 h5py==3.12.1 fsspec==2024.10.0 aiohttp==3.11.7
      - run: python -m mon.explorar_wrf "${{ inputs.corrida }}"
