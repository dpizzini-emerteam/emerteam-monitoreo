name: Ensambles (pronóstico probabilístico)

# Probabilidad de alcanzar cada nivel por evento y ventana con ECMWF ENS (CC BY 4.0) y NOAA GEFS.
# Programación pendiente de definir: el repositorio es privado y los minutos de Actions tienen tope mensual.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "procesar (guarda en la base) o explorar (solo índices y tiempos)"
        type: choice
        options: [procesar, explorar]
        default: procesar
      forzar:
        description: "Reprocesar aunque la corrida ya esté guardada"
        type: boolean
        default: false
      evento:
        description: "Explorar: id del evento (vacío: el próximo activo)"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: ensambles
  cancel-in-progress: false

jobs:
  ensambles:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - name: Procesar
        if: inputs.modo != 'explorar'
        run: python -m mon.probabilistico ${{ inputs.forzar && '--forzar' || '' }}
      - name: Explorar
        if: inputs.modo == 'explorar'
        run: python -m mon.ensambles --evento "${{ inputs.evento }}"
