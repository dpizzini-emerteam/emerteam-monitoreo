name: Ensambles (pronóstico probabilístico)

# Probabilidad de alcanzar cada nivel por evento y ventana con ECMWF ENS (CC BY 4.0) y NOAA GEFS.
# ECMWF publica el ensamble de 00 y 12 UTC hasta +144 h (~07:40 y ~19:40 UTC); se revisa cada 3 h.
# Si la corrida ya está procesada para todos los eventos, termina en segundos.
on:
  schedule:
    # Cada 3 h: si la corrida ya está procesada termina en segundos; así no depende de un único horario
    # (GitHub demora o descarta corridas programadas y ECMWF no siempre publica a la misma hora)
    - cron: "47 */3 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "procesar (guarda en la base) o explorar (solo índices y tiempos)"
        type: choice
        options: [procesar, explorar]
        default: procesar
      forzar:
        description: "Reprocesar aunque la corrida ya esté guardada"
        type: boolean
        default: false
      evento:
        description: "Explorar: id del evento (vacío: el próximo activo)"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: ensambles
  cancel-in-progress: false

jobs:
  ensambles:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - name: Procesar
        if: github.event_name == 'schedule' || inputs.modo != 'explorar'
        run: python -m mon.probabilistico ${{ inputs.forzar && '--forzar' || '' }}
      - name: Explorar
        if: github.event_name != 'schedule' && inputs.modo == 'explorar'
        run: python -m mon.ensambles --evento "${{ inputs.evento }}"
